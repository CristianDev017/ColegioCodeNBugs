<div class="container py-4">
  <h3 class="mb-3">Modificar tarifa</h3>

  @if (existe && registro) {
    <app-tarifa-form [esEdicion]="true" [registro]="registro"></app-tarifa-form>
  } @else if (cargado) {
    <div class="alert alert-danger">No se encontró la tarifa con id {{ id }}</div>
    <a routerLink="/tarifas" class="btn btn-primary">Volver al listado</a>
  }
</div>
