<div class="container py-4">
  <h3 class="mb-4">Editar usuario operativo</h3>
  @if (cargando) {
    <p>Cargando...</p>
  } @else if (noEncontrado) {
    <div class="alert alert-danger">No se encontró el usuario.</div>
    <a routerLink="/usuarios-operativos" class="btn btn-outline-primary">Volver al listado</a>
  } @else {
    <app-usuario-operativo-form [esEdicion]="true" [registro]="registro"></app-usuario-operativo-form>
  }
</div>
