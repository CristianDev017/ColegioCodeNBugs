<div class="container py-4">
  <h3 class="mb-4">Editar libro</h3>
  @if (cargando) {
    <p>Cargando...</p>
  } @else if (noEncontrado) {
    <div class="alert alert-danger">No se encontró el libro.</div>
    <a routerLink="/libros" class="btn btn-outline-primary">Volver al listado</a>
  } @else {
    <app-libro-form [esEdicion]="true" [registro]="registro"></app-libro-form>
  }
</div>
