<main class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h4 mb-0">Inicio</h1>
      @if (auth.usuario$ | async; as usuario) {
        <p class="text-secondary mb-0">{{ usuario.username }} - {{ usuario.rol }}</p>
      }
    </div>
    <button type="button" class="btn btn-outline-secondary" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>

  @if (auth.tieneRol(['SUPER_ADMIN'])) {
    <a class="btn btn-outline-dark" routerLink="/usuarios-admin">Usuarios administrativos</a>
  }
</main>
