<main class="container py-5" style="max-width: 420px">
  <form class="card shadow-sm" [formGroup]="formulario" (ngSubmit)="ingresar()" novalidate>
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Colegio</h1>
      <p class="text-secondary mb-4">Inicie sesión para continuar</p>

      @if (error) {
        <div class="alert alert-danger py-2">{{ error }}</div>
      }

      <div class="mb-3">
        <label class="form-label" for="username">Usuario o correo</label>
        <input id="username" type="text" class="form-control" formControlName="username"
               [class.is-invalid]="formulario.controls['username'].touched && formulario.controls['username'].invalid" />
        <div class="invalid-feedback">Ingrese su usuario o correo.</div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Contraseña</label>
        <input id="password" type="password" class="form-control" formControlName="password"
               [class.is-invalid]="formulario.controls['password'].touched && formulario.controls['password'].invalid" />
        <div class="invalid-feedback">Ingrese su contraseña.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </div>
  </form>
</main>
