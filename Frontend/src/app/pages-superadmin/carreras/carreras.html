
<div class="container mt-4">
  <a routerLink="/superadmin" class="btn btn-outline-secondary mb-3">
    Volver al inicio
  </a>

  <h3>Administracion de Carreras</h3>
  <hr>

  <div *ngIf="mensaje" class="alert alert-success">
    {{ mensaje }}
  </div>

  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <h5>{{ idEditar === 0 ? 'Nueva carrera' : 'Editar carrera' }}</h5>

      <form (ngSubmit)="guardar()">
        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input
            type="text"
            class="form-control"
            name="nombre"
            [(ngModel)]="nombre"
            maxlength="100"
            required>
        </div>

        <div class="mb-3">
          <label class="form-label">Descripcion</label>
          <textarea
            class="form-control"
            name="descripcion"
            [(ngModel)]="descripcion"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="guardando">
          {{ guardando ? 'Guardando...' : (idEditar === 0 ? 'Guardar' : 'Actualizar') }}
        </button>

        <button
          *ngIf="idEditar !== 0"
          type="button"
          class="btn btn-secondary ms-2"
          [disabled]="guardando"
          (click)="limpiar()">
          Cancelar
        </button>
      </form>
    </div>
  </div>

  <table class="table table-striped align-middle">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Descripcion</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let carrera of carreras">
        <td>{{ carrera.idCarrera }}</td>
        <td>{{ carrera.nombre }}</td>
        <td>{{ carrera.descripcion }}</td>
        <td>
          <span
            class="badge"
            [ngClass]="carrera.activo ? 'bg-success' : 'bg-secondary'">
            {{ carrera.activo ? 'Activa' : 'Inactiva' }}
          </span>
        </td>
        <td>
          <button
            type="button"
            class="btn btn-sm btn-warning me-2"
            (click)="seleccionar(carrera)">
            Editar
          </button>

          <button
            type="button"
            class="btn btn-sm"
            [ngClass]="carrera.activo ? 'btn-danger' : 'btn-success'"
            (click)="cambiarEstado(carrera)">
            {{ carrera.activo ? 'Desactivar' : 'Activar' }}
          </button>
        </td>
      </tr>
    </tbody>
  </table>
</div>
